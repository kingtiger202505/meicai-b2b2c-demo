name: Deploy miniapp (H5) to test

# 推到 001 分支即自动部署到测试机（对外 :8080，QA 走 nip.io）
on:
  push:
    branches: [ '001' ]
    paths:
      - 'miniapp/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'deploy/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-001
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync source to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/meicai-miniapp' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude 'build' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Build & start on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/meicai-miniapp' }}
          TARO_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TARO_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TARO_APP_STORE_ID: ${{ secrets.STORE_ID }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             export TARO_APP_SUPABASE_URL='$TARO_APP_SUPABASE_URL' && \
             export TARO_APP_SUPABASE_ANON_KEY='$TARO_APP_SUPABASE_ANON_KEY' && \
             export TARO_APP_STORE_ID='$TARO_APP_STORE_ID' && \
             docker compose up -d --build && \
             docker image prune -f"

      - name: Smoke check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 5
          curl -fsSI "http://$DEPLOY_HOST:8080" | head -n 1 || (echo "smoke check failed" && exit 1)

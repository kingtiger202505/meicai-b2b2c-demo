name: Deploy miniapp (H5) + POS + admin + platform to test

# 推到 001 分支即自动部署到测试机（miniapp → :8080，POS → :8081，admin → :8082，platform → :8083，QA 走 nip.io）
on:
  push:
    branches: [ '001' ]
    paths:
      - 'miniapp/**'
      - 'apps/pos/**'
      - 'apps/admin/**'
      - 'apps/platform/**'
      - 'packages/**'
      - 'Dockerfile'
      - 'Dockerfile.pos'
      - 'Dockerfile.admin'
      - 'Dockerfile.platform'
      - 'docker-compose.yml'
      - 'deploy/**'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-001
  cancel-in-progress: true

jobs:
  # 先按顺序把「尚未应用」的 DB 迁移跑上去（用 schema_migrations 账本，每个文件只跑一次）。
  # 凭据放 GitHub Secret SUPABASE_DB_URL（pooler 直连串，IPv4 友好）。未配置则跳过（warning）。
  # 账本已回填至当前全部迁移(0001-0019)，故本 job 上线后对现有迁移是 no-op，只跑将来新增的。
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pending Supabase migrations (ordered, once each)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL 未配置，跳过 DB 迁移（新迁移需手动应用或补上该 Secret）"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          # 账本表：记录已应用的迁移文件名，保证每个文件只跑一次（避免重跑非幂等/seed 迁移）
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
            "create table if not exists schema_migrations(filename text primary key, applied_at timestamptz not null default now());"
          for f in $(ls supabase/migrations/*.sql | sort); do
            base=$(basename "$f")
            applied=$(psql "$SUPABASE_DB_URL" -tAc "select 1 from schema_migrations where filename='$base'")
            if [ "$applied" = "1" ]; then echo "skip $base (已应用)"; continue; fi
            echo "=== applying $base ==="
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "insert into schema_migrations(filename) values ('$base') on conflict do nothing;"
          done
          echo "DB migrations up to date ✓"

  deploy:
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || '22' }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync source to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/meicai-miniapp' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'dist' --exclude 'build' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Build & start on server (+ open host firewall + diagnostics)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/meicai-miniapp' }}
          TARO_APP_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TARO_APP_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TARO_APP_STORE_ID: ${{ secrets.STORE_ID }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # 写构建期配置到 .env（docker compose 自动读取），避免把密钥内联进远端脚本
          # miniapp 用 TARO_APP_*，POS 用 VITE_*（同一个 Supabase 项目）
          # POS 的门店由登录后 current_staff_store() 解析，故不注入 VITE_STORE_ID
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cat > '$DEPLOY_PATH/.env' <<EOF
          TARO_APP_SUPABASE_URL=$TARO_APP_SUPABASE_URL
          TARO_APP_SUPABASE_ANON_KEY=$TARO_APP_SUPABASE_ANON_KEY
          TARO_APP_STORE_ID=$TARO_APP_STORE_ID
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          EOF"
          # 远端：开放宿主防火墙 8080/8081（不 reload，避免冲掉其它容器的 iptables）+ 重建服务 + 自检
          ssh -i ~/.ssh/id_ed25519 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" DEPLOY_PATH="$DEPLOY_PATH" bash -s <<'REMOTE'
          set -e
          cd "$DEPLOY_PATH"
          echo "=== open host firewall 8080/8081/8082/8083 (best-effort, no reload) ==="
          if command -v firewall-cmd >/dev/null 2>&1 && firewall-cmd --state >/dev/null 2>&1; then
            for p in 8080 8081 8082 8083; do
              firewall-cmd --add-port=$p/tcp || true            # 运行时立即生效
              firewall-cmd --permanent --add-port=$p/tcp || true # 持久化（不 --reload）
            done
            echo "firewalld ports: $(firewall-cmd --list-ports 2>/dev/null)"
          elif command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -qi active; then
            ufw allow 8080/tcp || true; ufw allow 8081/tcp || true; ufw allow 8082/tcp || true; ufw allow 8083/tcp || true
          else
            echo "no active firewalld/ufw detected"
          fi
          echo "=== docker compose up (build+recreate miniapp & pos & admin & platform) ==="
          docker compose up -d --build --force-recreate
          docker image prune -f || true
          sleep 4
          echo "=== docker compose ps ==="; docker compose ps || docker ps
          echo "=== restart policy / health ==="
          for c in meicai-miniapp meicai-pos meicai-admin meicai-platform; do
            docker inspect -f 'name={{.Name}} status={{.State.Status}} restart_policy={{.HostConfig.RestartPolicy.Name}} restarts={{.RestartCount}}' "$c" 2>/dev/null || echo "inspect $c failed"
          done
          echo "=== listening on 8080/8081/8082/8083 ==="; (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ':8080|:8081|:8082|:8083' || echo "NOT LISTENING on 8080/8081/8082/8083"
          echo "=== local curl ==="
          curl -fsS -m 10 -o /dev/null -w 'localhost:8080 => HTTP %{http_code}\n' http://localhost:8080 || echo "LOCAL CURL 8080 FAILED"
          curl -fsS -m 10 -o /dev/null -w 'localhost:8081 => HTTP %{http_code}\n' http://localhost:8081 || echo "LOCAL CURL 8081 FAILED"
          curl -fsS -m 10 -o /dev/null -w 'localhost:8082 => HTTP %{http_code}\n' http://localhost:8082 || echo "LOCAL CURL 8082 FAILED"
          curl -fsS -m 10 -o /dev/null -w 'localhost:8083 => HTTP %{http_code}\n' http://localhost:8083 || echo "LOCAL CURL 8083 FAILED"
          REMOTE

      - name: Smoke check (reachability + 产物内联校验)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          sleep 3
          base="http://$DEPLOY_HOST:8080"
          code=$(curl -s -m 25 -o /dev/null -w '%{http_code}' "$base/" || echo 000)
          echo "external $base => HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::从 GitHub runner 访问 :8080 失败 (HTTP $code)。若远端 local curl 为 200，则多为云安全组未放行 8080/tcp。"
            exit 1
          fi
          echo "external 8080 reachable ✓"
          # 200 只证明静态外壳在；再校验主 JS 里 TARO_APP_* 已内联(否则浏览器会白屏)
          html=$(curl -s -m 20 "$base/")
          appjs=$(printf '%s' "$html" | grep -oE 'js/app\.[0-9a-f]+\.js' | head -1)
          if [ -z "$appjs" ]; then echo "::warning::未从首页解析到主 JS，跳过内联校验"; exit 0; fi
          js=$(curl -s -m 30 "$base/$appjs")
          if printf '%s' "$js" | grep -qF 'process.env.TARO_APP_'; then
            echo "::error::线上产物残留未内联的 process.env.TARO_APP_* —— 浏览器会白屏(ReferenceError: process is not defined)"
            exit 1
          fi
          echo "no bare process.env.TARO_APP_ in $appjs ✓"
          if printf '%s' "$js" | grep -qF 'supabase.co'; then
            echo "supabase URL inlined ✓"
          else
            echo "::warning::主 JS 未见 supabase 域名——菜单可能读不到后端(检查 SUPABASE_URL secret)"
          fi

      - name: Smoke check POS (:8081)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          base="http://$DEPLOY_HOST:8081"
          code=$(curl -s -m 25 -o /dev/null -w '%{http_code}' "$base/" || echo 000)
          echo "external $base => HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::从 GitHub runner 访问 POS :8081 失败 (HTTP $code)。若远端 local curl 为 200，则多为云安全组未放行 8081/tcp。"
            exit 1
          fi
          echo "external 8081 reachable ✓"
          # 校验 POS 主 JS 里已内联 supabase 域名（否则 demo 账号登录会失败）
          html=$(curl -s -m 20 "$base/")
          appjs=$(printf '%s' "$html" | grep -oE 'assets/index-[0-9A-Za-z_-]+\.js' | head -1)
          if [ -z "$appjs" ]; then echo "::warning::未从 POS 首页解析到主 JS，跳过内联校验"; exit 0; fi
          js=$(curl -s -m 30 "$base/$appjs")
          if printf '%s' "$js" | grep -qF 'supabase.co'; then
            echo "POS supabase URL inlined ✓"
          else
            echo "::error::POS 主 JS 未见 supabase 域名——demo 账号将无法登录(检查 VITE_SUPABASE_URL 构建参数)"
            exit 1
          fi

      - name: Smoke check admin (:8082)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          base="http://$DEPLOY_HOST:8082"
          code=$(curl -s -m 25 -o /dev/null -w '%{http_code}' "$base/" || echo 000)
          echo "external $base => HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::从 GitHub runner 访问 admin :8082 失败 (HTTP $code)。若远端 local curl 为 200，则多为云安全组未放行 8082/tcp。"
            exit 1
          fi
          echo "external 8082 reachable ✓"
          # 校验 admin 主 JS 里已内联 supabase 域名（否则 owner demo 账号登录会失败）
          html=$(curl -s -m 20 "$base/")
          appjs=$(printf '%s' "$html" | grep -oE 'assets/index-[0-9A-Za-z_-]+\.js' | head -1)
          if [ -z "$appjs" ]; then echo "::warning::未从 admin 首页解析到主 JS，跳过内联校验"; exit 0; fi
          js=$(curl -s -m 30 "$base/$appjs")
          if printf '%s' "$js" | grep -qF 'supabase.co'; then
            echo "admin supabase URL inlined ✓"
          else
            echo "::error::admin 主 JS 未见 supabase 域名——owner demo 账号将无法登录(检查 VITE_SUPABASE_URL 构建参数)"
            exit 1
          fi

      - name: Smoke check platform (:8083)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          base="http://$DEPLOY_HOST:8083"
          code=$(curl -s -m 25 -o /dev/null -w '%{http_code}' "$base/" || echo 000)
          echo "external $base => HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::从 GitHub runner 访问 platform :8083 失败 (HTTP $code)。若远端 local curl 为 200，则多为云安全组未放行 8083/tcp。"
            exit 1
          fi
          echo "external 8083 reachable ✓"
          # 校验 platform 主 JS 里已内联 supabase 域名（否则平台账号登录会失败）
          html=$(curl -s -m 20 "$base/")
          appjs=$(printf '%s' "$html" | grep -oE 'assets/index-[0-9A-Za-z_-]+\.js' | head -1)
          if [ -z "$appjs" ]; then echo "::warning::未从 platform 首页解析到主 JS，跳过内联校验"; exit 0; fi
          js=$(curl -s -m 30 "$base/$appjs")
          if printf '%s' "$js" | grep -qF 'supabase.co'; then
            echo "platform supabase URL inlined ✓"
          else
            echo "::error::platform 主 JS 未见 supabase 域名——平台账号将无法登录(检查 VITE_SUPABASE_URL 构建参数)"
            exit 1
          fi

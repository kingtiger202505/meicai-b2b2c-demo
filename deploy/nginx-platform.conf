server {
    listen 8083;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
